<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Pintar X-4</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white w-full max-w-lg rounded-2xl shadow-xl overflow-hidden p-6 mb-6">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">🏫 Absensi Digital X-4</h1>
            <p class="text-sm text-slate-500">Silakan isi data diri dan ambil foto kehadiran</p>
        </div>

        <form id="absenForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap</label>
                <input type="text" id="nama" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Masukkan nama kamu">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nomor Induk / NISN</label>
                <input type="text" id="nisn" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Masukkan NISN">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Status Kehadiran</label>
                <select id="status" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="Hadir">Hadir</option>
                    <option value="Izin">Izin</option>
                    <option value="Sakit">Sakit</option>
                </select>
            </div>

            <div class="border-2 border-dashed border-slate-300 rounded-xl p-4 text-center">
                <p class="text-sm font-medium text-slate-700 mb-2">📸 Bukti Foto Kehadiran</p>
                <video id="video" width="100%" autoplay class="rounded-lg mb-2 bg-black hidden"></video>
                <canvas id="canvas" class="hidden"></canvas>
                <img id="fotoHasil" class="rounded-lg mx-auto mb-2 hidden max-h-48 object-cover" alt="Hasil Foto">
                
                <button type="button" id="btnKamera" class="bg-slate-800 text-white text-sm px-4 py-2 rounded-lg hover:bg-slate-700 transition">Buka Kamera</button>
                <button type="button" id="btnSnap" class="bg-emerald-600 text-white text-sm px-4 py-2 rounded-lg hover:bg-emerald-500 transition hidden">Ambil Foto</button>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-500 transition shadow-lg shadow-blue-500/30">
                Kirim Absen Sekarang
            </button>
        </form>
    </div>

    <!-- Kotak Rekap Tabel Kehadiran -->
    <div class="bg-white w-full max-w-lg rounded-2xl shadow-xl overflow-hidden p-6">
        <h3 class="font-bold text-slate-800 mb-4">📋 Rekap Kehadiran Hari Ini</h3>
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-100 text-xs text-slate-600 uppercase">
                        <th class="p-2 border">Waktu</th>
                        <th class="p-2 border">Nama</th>
                        <th class="p-2 border">NISN</th>
                        <th class="p-2 border">Status</th>
                        <th class="p-2 border">Foto</th>
                    </tr>
                </thead>
                <tbody id="tabelAbsen" class="text-sm text-slate-700">
                    <tr>
                        <td colspan="5" class="p-4 text-center text-slate-400 italic">Belum ada data absensi masuk.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const fotoHasil = document.getElementById('fotoHasil');
        const btnKamera = document.getElementById('btnKamera');
        const btnSnap = document.getElementById('btnSnap');
        const absenForm = document.getElementById('absenForm');
        const tabelAbsen = document.getElementById('tabelAbsen');

        let streamKamera = null;
        let base64Foto = "";
        let dataKehadiran = [];

        // Nyalakan Kamera
        btnKamera.addEventListener('click', async () => {
            try {
                streamKamera = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = streamKamera;
                video.classList.remove('hidden');
                btnKamera.classList.add('hidden');
                btnSnap.classList.remove('hidden');
            } catch (err) {
                alert("Gagal mengakses kamera! Pastikan izin kamera diizinkan di browser kamu.");
            }
        });

        // Ambil Foto
        btnSnap.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            base64Foto = canvas.toDataURL('image/jpeg', 0.5);
            fotoHasil.src = base64Foto;
            fotoHasil.classList.remove('hidden');
            video.classList.add('hidden');
            btnSnap.classList.add('hidden');

            if (streamKamera) {
                streamKamera.getTracks().forEach(track => track.stop());
            }
        });

        // Submit Form & Masukkan ke Tabel
        absenForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const nama = document.getElementById('nama').value;
            const nisn = document.getElementById('nisn').value;
            const status = document.getElementById('status').value;
            const waktu = new Date().toLocaleTimeString('id-ID');

            if (!base64Foto) {
                alert("Mohon ambil foto wajah kamu terlebih dahulu!");
                return;
            }

            // Simpan data ke array
            dataKehadiran.push({ waktu, nama, nisn, status, foto: base64Foto });

            // Reset form & foto
            absenForm.reset();
            fotoHasil.classList.add('hidden');
            btnKamera.classList.remove('hidden');
            base64Foto = "";

            // Update Tampilan Tabel
            renderTabel();
        });

        function renderTabel() {
            if (dataKehadiran.length === 0) {
                tabelAbsen.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400 italic">Belum ada data absensi masuk.</td></tr>`;
                return;
            }

            let html = "";
            dataKehadiran.forEach((item) => {
                html += `
                    <tr class="border-b">
                        <td class="p-2 border text-xs">${item.waktu}</td>
                        <td class="p-2 border font-medium">${item.nama}</td>
                        <td class="p-2 border">${item.nisn}</td>
                        <td class="p-2 border"><span class="px-2 py-1 text-xs rounded bg-emerald-100 text-emerald-800">${item.status}</span></td>
                        <td class="p-2 border text-center"><img src="${item.foto}" class="w-10 h-10 object-cover rounded mx-auto"></td>
                    </tr>
                `;
            });
            tabelAbsen.innerHTML = html;
        }
    </script>
</body>
</html>
